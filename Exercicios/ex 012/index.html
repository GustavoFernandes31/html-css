<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando videos</title>
</head>
<body>
    <h1>Testando videos</h1>
    <p>Agora vamos testar vídeos no HTML.</p>
    <video width="560px" controls>
        <source src="midia/Meu-Video.webm" type="video/webm">
        <source src="midia/meu-video.mp4" type="video/mp4">
        <p>Seu navegador nao tem compatibilidade com vídeos.</p>
    </video>
    <h2>Inserindo videos do youtube</h2>
    <p>Agora vamos inserir vídeos do YouTube.</p>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/Ejkb_YpuHWs?si=2N7B5Kvgy8NvJTVg" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
