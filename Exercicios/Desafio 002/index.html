<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAGS html</title>
</head>
<body>
    <h1>Tags em html</h1>
    <P>Em html5 podemos inserir os elementos da lista a seguir</P>
    <ul>
        <li>
            <abbr title="Usamos a tag &lt;p&gt;">Paragrafo</abbr>
        </li>
        <li>
            <abbr title="Usamos a tag &lt;li&gt;">Itens de uma lista</abbr>
        </li>
        <li>
            <abbr title="Usamos a tag &lt;abbr&gt;">Abreviaçoes</abbr>
        </li>
    </ul>
</body>
</html>
