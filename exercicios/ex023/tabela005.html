<head>

    <title>Exercício de tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
            width: 500px;
        }
        caption{
            font-size: 1.4em;
            font-weight: bolder;
            padding: 5px;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        .coln{
            background-color: yellow;
        }
        .colv{
            background-color: aqua;
        }
    </style>
</head>
