<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5</title>
    <style>
        body {
            background-color: black;
        }
        h1{
            color: white;
            text-align: center;
            margin-bottom: 40px;
        }
        a{
            color: white;
            margin-top: 10px;
            text-decoration:none;
            display: block;
            text-align: center;

        }

        a:hover {
            text-decoration: underline;
            color: aqua;
        }

        img.voltar::after{
            content: 'Fingi que ficou roxo';
        }

        iframe {
            border-radius: 5px;
            display: block;
            margin: auto;
        }
        img.voltar{
            width: 50px;
            display: block;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <h1>Curso de HTML5(antigo)</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/epDCjksKMok?si=0yn85Y8V2xhUhEZa" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <a href="https://www.youtube.com/watch?v=epDCjksKMok&list=PLHz_AreHm4dlAnJ_jJtV29RFxnPHDuk9o" target="_blank" rel="external">Veja o curso completo</a>
    <a href="index.html" target="_self" rel="prev">
        <img class="voltar" src="tunbs/voltar.png" alt="voltar">

</html>
