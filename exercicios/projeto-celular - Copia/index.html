<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora</title>
</head>
<body>
    <div class="conteiner" id="corpo">
        <div id="leitor">0</div>
        <div class="botoes">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>+</button>
            <br>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
            <br>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>*</button>
            <br>
            <button>0</button>
            <button>.</button>
            <button>=</button>
            <button>/</button>
            <br>
            <button id="limpar">LIMPAR</button>
        </div>
    </div>

    <!-- Referência ao ficheiro JavaScript -->
    <script src="script.js"></script>
</body>
</html>
