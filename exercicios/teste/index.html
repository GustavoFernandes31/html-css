<!DOCTYPE html>
<html lang="pt-br>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de incorporação e centralização de divs verticalmente</title>
    <style>
        #conteiner{
            position: relative;
            background-color: aqua;
            height: 97vh;
            background-image: url(/exercicios/ex022/imagens/target001.png);
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        #conteudo{
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50% , -50%);
        }
    </style>
</head>
<body>
    <h1>Estou testando o centralizamento de divs na vertical</h1>
    <div id="conteiner">
        <div id="conteudo">
            <iframe width="200" height="200" src="https://www.youtube.com/embed/Per2Cm4SU-A?si=j2QoN41yg_DkQMdj" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </div>
</body>
</html>
