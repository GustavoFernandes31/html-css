<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1{
            background-color: lightblue;
            height: 300px;
            width: 300px;
            border-width: 10px;
            border-style: solid;

            padding: 10px 10px;

            border:10px solid salmon;

            margin: 10px auto 10px auto;

            outline: 30px hidden red;
        }
        a{
            border-width: 10px;
            border-style: solid;
            border-color: red;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa Box-level</h1>
    <p>Paragrafos tambem sao exemplos box-level, mas os <a href="#"> Links são exemplos Inline-level</a>. Vamos ver como tudo isso funciona</p>
</body>
</html>
